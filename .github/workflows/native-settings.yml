name: Native Settings qualification
on:
  pull_request:
    paths:
      - 'Apps/settings*'
      - 'lib/PortableApps/**'
      - 'scripts/*native_settings*'
      - 'scripts/build_portable_settings.py'
      - 'scripts/*native_overlay*'
      - 'docs/native-overlays/**'
      - 'tests/test_native_overlay*'
      - 'test/native_apps/**'
      - 'tests/test_native_settings_*.py'
      - '.github/workflows/native-settings.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        shell: bash
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 48229bd1593a2e24e95bf4537b495ee615990fd3
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Watch
          ref: 6e82fdcaec0b73ed700d2104cfb4d94f011c19d4
          path: bridges
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06
          ref: b9862e1379813a0914d4926ef59a3feb6fcf656a
          path: profile-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: e80172353fcb9e6519ca9d9b2a4d43c69c1bc91d
          path: utilities
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actual native pages, timezone and delayed-frame ownership
        run: |
          mkdir -p build/native-settings
          python scripts/test_native_settings.py --output build/native-settings/layout | tee build/native-settings/layout.log
          python scripts/test_native_settings_ownership.py --runtime ../runtime --output build/native-settings/ownership | tee build/native-settings/ownership.log
          python scripts/test_native_settings_capture.py --runtime ../runtime --output build/native-settings/capture | tee build/native-settings/capture.log
          python scripts/test_native_settings_capture.py --runtime ../runtime --output build/native-settings/capture-snapshot --snapshot | tee build/native-settings/capture-snapshot.log
          python scripts/test_native_settings_timers.py --output build/native-settings/timers | tee build/native-settings/timers.log
          python scripts/test_native_settings_timers.py --output build/native-settings/timers-snapshot --snapshot --case 7 | tee build/native-settings/timers-snapshot.log
      - name: Complete recipe boundaries, Quick Controls and generic sleep/motion bridges
        run: |
          python -m unittest discover -s tests -p 'test_native_settings_*.py' -v 2>&1 | tee build/native-settings/unit-tests.log
          python -m unittest discover -s tests -p 'test_native_overlay*.py' -v 2>&1 | tee build/native-settings/overlay-contracts.log
          python scripts/test_native_settings_features.py --system . --output build/native-settings/features
          python scripts/test_native_settings_bridges.py --system . --bridges ../bridges --runtime ../runtime --profile-source ../profile-source --output build/native-settings/bridges
      - name: Actual app native overlays, persistence and queued-input ownership
        run: |
          python scripts/test_native_overlay_apps.py --runtime ../runtime --app settings --output build/native-settings/overlays-normal 2>&1 | tee build/native-settings/overlays-normal.log
          python scripts/test_native_overlay_apps.py --runtime ../runtime --app settings --sanitize --output build/native-settings/overlays-sanitized 2>&1 | tee build/native-settings/overlays-sanitized.log
      - name: Install pinned public target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Six unselected-profile ELF preservation witnesses
        run: python scripts/test_native_settings_opt_out.py --xtensa-cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" --output build/native-settings/opt-out
      - name: Exact-source 16-capability native Settings development app
        run: |
          python scripts/build_native_settings_qualification.py --bridges ../bridges --runtime ../runtime --profile-source ../profile-source --utilities ../utilities --output-dir build/native-settings/app
          python -c "import json; r=json.load(open('build/native-settings/app/settings-build-record.json')); assert not r['working_tree_dirty']; assert r['version']=='1.4.2' and r['bundle']=='native-settings-1.4.2-dev1' and len(r['required_capabilities'])==16"
          python scripts/report_native_settings_memory.py --elf build/native-settings/app/settings.elf --runtime ../runtime --output build/native-settings/admission
          cp build/native-settings/admission/elf-memory-admission.json build/native-settings/app/memory-admission.json
          python scripts/report_native_overlay_successor.py --app settings --app-dir build/native-settings/app --memory build/native-settings/admission/elf-memory-admission.json --output build/native-settings/app/native-overlay-comparison.json
          cp docs/native-settings/retained-memory-comparison.json build/native-settings/app/historical-1.4.0-retained-memory-comparison.json
      - name: Validate complete immutable publication evidence before merge
        run: python scripts/native_overlay_evidence.py --app settings --artifact build/native-settings --source-sha '${{ github.event.pull_request.head.sha || github.sha }}' | tee build/native-settings/native-overlay-publication-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-settings-software-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            source/build/native-settings/**/*.json
            source/build/native-settings/**/*.log
            source/build/native-settings/overlays-*/**
            source/build/native-settings/**/*.ppm
            source/build/native-settings/app/settings.elf
            source/build/native-settings/app/licenses/
          if-no-files-found: error
          retention-days: 30
  publish-development:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: qualify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: native-settings-software-qualification-${{ github.sha }}
          path: qualified
      - name: Annotate preserved dev1 with its confirmed input limitation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_native_settings.py --repository '${{ github.repository }}' --annotate-dev1
      - name: Publish or verify immutable standalone development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_native_settings.py --artifact qualified --repository '${{ github.repository }}' --source-sha '${{ github.sha }}'
