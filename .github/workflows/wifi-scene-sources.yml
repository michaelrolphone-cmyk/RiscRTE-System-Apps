name: Wi-Fi scene source snapshot
on:
  push:
    branches: [feat/wifi-scene-manager]
    paths: [.github/workflows/wifi-scene-sources.yml]
  pull_request:
    paths: [.github/workflows/wifi-scene-sources.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: System
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: a304597bf26491483bb0a567569f0ca0267cdf9c
          path: Watch
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 8d713b52edca004e1d53bf30a1c584859fe33d14
          path: Runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: 65d2ccf2c0eb5179a00d87544c519d9daa6a6b6d
          path: Utilities
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiskRTE-XTEINK-X4-PRO
          ref: cf3a6b6961bcd624913b1238eaaa8a585e64d875
          path: X4
          persist-credentials: false
      - run: tar -czf wifi-development-sources.tar.gz System Runtime Watch Utilities X4
      - uses: actions/upload-artifact@v4
        with:
          name: wifi-development-sources
          path: wifi-development-sources.tar.gz
          retention-days: 3
          compression-level: 0
