name: Wi-Fi scene source snapshot
on:
  push:
    branches: [feat/wifi-scene-manager]
    paths: [.github/workflows/wifi-scene-sources.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: a304597bf26491483bb0a567569f0ca0267cdf9c
          path: Watch
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 8d713b52edca004e1d53bf30a1c584859fe33d14
          path: Runtime
          persist-credentials: false
      - run: tar -czf wifi-deployed-sources.tar.gz Runtime Watch
      - uses: actions/upload-artifact@v4
        with:
          name: wifi-deployed-sources
          path: wifi-deployed-sources.tar.gz
          retention-days: 3
          compression-level: 0
