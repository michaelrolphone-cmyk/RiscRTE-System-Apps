name: Immutable storage inventory
on:
  pull_request:
    paths:
      - scripts/audit_storage_refs.py
      - tests/test_storage_ref_inventory.py
      - docs/storage/inventory-20261022/**
      - .github/workflows/storage-inventory.yml
  push:
    branches: [main]
    paths:
      - scripts/audit_storage_refs.py
      - tests/test_storage_ref_inventory.py
      - docs/storage/inventory-20261022/**
      - .github/workflows/storage-inventory.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test immutable refs and explicit coverage boundaries
        run: python -m unittest discover -s tests -p test_storage_ref_inventory.py -v
      - name: Test repository Python regressions
        run: python -m unittest discover -s tests -v
