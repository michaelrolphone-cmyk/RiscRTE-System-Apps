name: Immutable storage inventory
on:
  pull_request:
    paths:
      - scripts/audit_storage_refs.py
      - tests/test_storage_ref_inventory.py
      - tests/test_storage_garden_inventory.py
      - tests/test_storage_freeink_inventory.py
      - docs/storage/inventory-20261022/**
      - docs/storage/inventory-20261023-garden/**
      - docs/storage/inventory-20261023-freeink/**
      - .github/workflows/storage-inventory.yml
  push:
    branches: [main]
    paths:
      - scripts/audit_storage_refs.py
      - tests/test_storage_ref_inventory.py
      - tests/test_storage_garden_inventory.py
      - tests/test_storage_freeink_inventory.py
      - docs/storage/inventory-20261022/**
      - docs/storage/inventory-20261023-garden/**
      - docs/storage/inventory-20261023-freeink/**
      - .github/workflows/storage-inventory.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test immutable refs and explicit coverage boundaries
        run: python -m unittest discover -s tests -p test_storage_ref_inventory.py -v
      - name: Test repository Python regressions
        run: python -m unittest discover -s tests -v
      - name: Fetch only the pinned Garden source for inventory reproduction
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/Garden-Controller
          ref: 2b01d37ac5a6b643b8bc25758a07787587d7ca7e
          path: .inventory-sources/Garden-Controller
          persist-credentials: false
      - name: Reproduce the Garden source report without running Garden code
        run: |
          python scripts/audit_storage_refs.py --manifest docs/storage/inventory-20261023-garden/sources.json --checkout-root .inventory-sources --output-dir "$RUNNER_TEMP/garden-storage-report"
          diff -ru docs/storage/inventory-20261023-garden/evidence "$RUNNER_TEMP/garden-storage-report"
      - name: Fetch pinned RiscRTE-Productivity source without submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Productivity
          ref: bb8d0d99b3a857103d2b01e6b4c756b913aa14d3
          path: .inventory-sources/RiscRTE-Productivity
          persist-credentials: false
      - name: Fetch pinned crosspoint-reader source without submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: crosspoint-reader/crosspoint-reader
          ref: 3607ea7bb95d65b4cf3edf1aa89b2b0970985793
          path: .inventory-sources/crosspoint-reader
          persist-credentials: false
      - name: Fetch pinned freeink-sdk source without submodules
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Free-Ink/freeink-sdk
          ref: 425d200a8ea447326b4b9696e4e47dc84ad9d7f6
          path: .inventory-sources/freeink-sdk
          persist-credentials: false
      - name: Verify parent gitlinks and reproduce nested SDK report
        run: |
          python - <<'PYCODE'
          import json, subprocess
          from pathlib import Path
          provenance = json.loads(Path('docs/storage/inventory-20261023-freeink/provenance.json').read_text())
          for edge in provenance['gitlink_edges']:
              def git(*args):
                  return subprocess.check_output(['git', '--no-replace-objects', '-C', '.inventory-sources/' + edge['repository'].split('/')[-1], *args], text=True).strip()
              assert git('ls-tree', edge['commit'], edge['path']) == '160000 commit ' + edge['child_commit'] + '\t' + edge['path']
              assert git('rev-parse', edge['commit'] + ':.gitmodules') == edge['modules_blob']
              assert git('config', '--blob', edge['modules_blob'], '--get', 'submodule.' + edge['path'] + '.url') == edge['url']
          tree = subprocess.check_output(['git', '--no-replace-objects', '-C', '.inventory-sources/freeink-sdk', 'rev-parse', '425d200a8ea447326b4b9696e4e47dc84ad9d7f6^{tree}'], text=True).strip()
          assert tree == provenance['source_tree']
          PYCODE
          python scripts/audit_storage_refs.py --manifest docs/storage/inventory-20261023-freeink/sources.json --checkout-root .inventory-sources --output-dir "$RUNNER_TEMP/freeink-storage-report"
          diff -ru docs/storage/inventory-20261023-freeink/evidence "$RUNNER_TEMP/freeink-storage-report"
