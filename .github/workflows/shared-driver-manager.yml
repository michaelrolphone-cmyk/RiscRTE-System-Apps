name: Shared Driver Manager qualification
on:
  pull_request:
    paths: ['Apps/driver_manager*', 'scripts/*driver_manager*', 'test/driver_manager/**', 'docs/shared-driver-manager/**', '.github/workflows/shared-driver-manager.yml']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 710b200021b983ea55eb86a6fbddbbf5ce10a984
          path: Helpers
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: ab9ff33975680c5bb8d9a2e7ed346d0300732a4e
          path: Bootfs
          persist-credentials: false
      - name: Inspect exact published Bringup closure
        run: |
          python3 - <<'PY'
          import hashlib,json,sys,urllib.request,zipfile,io
          from pathlib import Path
          sys.path[:0]=['Helpers/scripts','Bootfs/scripts']
          from assemble_shared_usb_cohort import decode_store
          from read_only_spiffs import read_image
          assets=[{"name":"product-watch-sd-apps.zip","url":"https://github.com/michaelrolphone-cmyk/RiscRTE-Watch/releases/download/bringup-shared-233e43841483adf570ae833a88d9b6fc08d68f1a/product-watch-sd-apps.zip","bytes":22,"sha256":"8739c76e681f900923b900c9df0ef75cf421d39cabb54650c4b9ad19b6a76d85"},{"name":"product-watch-store.bin","url":"https://github.com/michaelrolphone-cmyk/RiscRTE-Watch/releases/download/bringup-shared-233e43841483adf570ae833a88d9b6fc08d68f1a/product-watch-store.bin","bytes":5570560,"sha256":"56120d7c9a64f269bf67ec5bb647deb35f68a8cfcc2b08b3be6611e3de343ac3"},{"name":"product-wave-sd-apps.zip","url":"https://github.com/michaelrolphone-cmyk/RiscRTE-Watch/releases/download/bringup-shared-233e43841483adf570ae833a88d9b6fc08d68f1a/product-wave-sd-apps.zip","bytes":1773644,"sha256":"a4408526e9d08e90d5fe9f5dfeffc34b3cb03970d06b35dc15551465339bb33e"},{"name":"product-wave-store.bin","url":"https://github.com/michaelrolphone-cmyk/RiscRTE-Watch/releases/download/bringup-shared-233e43841483adf570ae833a88d9b6fc08d68f1a/product-wave-store.bin","bytes":5570560,"sha256":"f92a9de1a8fb050b636476ff703ce68fa083a81c452b3ec82259f512733af64b"},{"name":"product-x4-sd-apps.zip","url":"https://github.com/michaelrolphone-cmyk/RiscRTE-Watch/releases/download/bringup-shared-233e43841483adf570ae833a88d9b6fc08d68f1a/product-x4-sd-apps.zip","bytes":5444854,"sha256":"c1948739143957840a57ed3d9de4b5f7359d42be93df7b670386c7c56498f59a"},{"name":"product-x4-store.bin","url":"https://github.com/michaelrolphone-cmyk/RiscRTE-Watch/releases/download/bringup-shared-233e43841483adf570ae833a88d9b6fc08d68f1a/product-x4-store.bin","bytes":5308416,"sha256":"30f8f4ed7e4d56ec73e1f24533aa47200b19058aa9d55e577b60b51f252c6ec9"}]
          out=Path('out/driver-manager-inventory');out.mkdir(parents=True)
          files={}
          for asset in assets:
           data=urllib.request.urlopen(asset['url'],timeout=120).read()
           assert len(data)==asset['bytes'] and hashlib.sha256(data).hexdigest()==asset['sha256']
           files[asset['name']]=data
          result={}
          for lane in ('watch','wave','x4'):
           raw=files[f'product-{lane}-store.bin']
           stored=read_image(raw,len(raw));canonical=decode_store(stored)
           with zipfile.ZipFile(io.BytesIO(files[f'product-{lane}-sd-apps.zip'])) as z:
            assert len(z.namelist())==len(set(z.namelist()))
            sd={n:z.read(n) for n in z.namelist()}
           boot=json.loads(canonical['boot.json'])
           manifests={n:json.loads(data) for n,data in canonical.items() if n.endswith('.json')}
           inventory={n:{'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()} for n,b in canonical.items()}
           sd_inventory={n:{'bytes':len(b),'sha256':hashlib.sha256(b).hexdigest()} for n,b in sd.items()}
           result[lane]={'boot':boot,'manifests':manifests,'inventory':inventory,'sd_inventory':sd_inventory}
           print('DRIVER_BASELINE '+lane+' '+json.dumps(result[lane]),flush=True)
          (out/'baseline.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-driver-manager-baseline-${{ github.event.pull_request.head.sha }}
          path: out/driver-manager-inventory/
          if-no-files-found: error
