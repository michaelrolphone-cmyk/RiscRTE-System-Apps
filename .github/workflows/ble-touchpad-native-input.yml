name: BLE Touchpad native input ownership
on:
  push:
  pull_request:
jobs:
  private-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/test_ble_touchpad_native_input.py
      - run: python3 scripts/test_ble_touchpad_native_optout.py
      - run: python3 scripts/test_ble_buttons_native_input.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ble-touchpad-native-ownership
          path: |
            build/ble-touchpad-native-input/*.json
            build/ble-touchpad-native-input/*.log
            build/ble-touchpad-native-optout/*.json
