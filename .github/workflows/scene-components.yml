name: NOVA scene components
on:
  pull_request:
  push:
    branches: [main, work/contexts-scene-footer-20261102]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scene-components:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: a9587bec00015ad56c302192a8359b6d70cde01a
          path: .deps/runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate and verify telemetry typography
        run: |
          python -m pip install Pillow==12.3.0
          python scripts/verify_telemetry_fonts.py
          git diff --exit-code
      - name: Legacy compatibility, components, and calendar policies
        run: |
          python scripts/test_scene_host.py --runtime .deps/runtime
          python scripts/test_scene_components.py --runtime .deps/runtime
          python scripts/test_civil_clock.py --runtime .deps/runtime
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: f965f1eb974c8e637f222bfc1ac57fc19402b6cf
          path: .deps/footer-baseline
          persist-credentials: false
      - name: Fixed-footer focus and touch, positive and negative controls
        run: |
          python scripts/test_scene_footer.py --runtime .deps/runtime --output build/footer
          python scripts/test_scene_footer.py --runtime .deps/runtime --output build/footer-sanitized --sanitize
          python scripts/test_scene_footer.py --runtime .deps/runtime --output build/footer-baseline --provider-root .deps/footer-baseline --baseline
      - name: Install pinned target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build and validate the presenter and both device profiles
        run: |
          python scripts/build_scene_services.py --runtime .deps/runtime --output dist/scene
          python scripts/build_scene_services.py --runtime .deps/runtime --output dist/scene-color --host-profile color-dynamic
          python scripts/build_scene_services.py --runtime .deps/runtime --output dist/scene-compact --host-profile watch-compact
          python scripts/build_civil_clock.py --runtime .deps/runtime --output dist/civil
      - name: Publish byte-verified provider dependency prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/work/contexts-scene-footer-20261102'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_scene_footer.py --build dist --runtime .deps/runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-scene-components-${{ github.sha }}
          path: |
            dist/scene/
            dist/civil/
            dist/scene-color/
            dist/scene-compact/
            dist/publication/
            build/footer*/
          if-no-files-found: error
          retention-days: 14
