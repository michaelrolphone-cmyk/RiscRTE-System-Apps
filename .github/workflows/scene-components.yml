name: NOVA scene components
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scene-components:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: a9587bec00015ad56c302192a8359b6d70cde01a
          path: .deps/runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Legacy compatibility, components, and calendar policies
        run: |
          python scripts/test_scene_host.py --runtime .deps/runtime
          python scripts/test_scene_components.py --runtime .deps/runtime
          python scripts/test_civil_clock.py --runtime .deps/runtime
      - name: Install pinned target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build and validate the presenter and both device profiles
        run: |
          python scripts/build_scene_services.py --runtime .deps/runtime --output dist/scene
          python scripts/build_civil_clock.py --runtime .deps/runtime --output dist/civil
      - uses: actions/upload-artifact@v4
        with:
          name: nova-scene-components-${{ github.sha }}
          path: |
            dist/scene/
            dist/civil/
          if-no-files-found: error
          retention-days: 14
