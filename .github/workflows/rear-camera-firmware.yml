name: Rear camera firmware
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firmware/esp32cam-rear-lidar/**'
      - 'firmware/esp32cam-rtsp-radio/overlay/src/**'
      - 'firmware/esp32cam-rtsp-radio/overlay/test/live_write_progress/**'
      - '.github/workflows/rear-camera-firmware.yml'
  push:
    branches: ['main', 'work/rear-camera-lidar-*', 'fix/rear-camera-*']
    paths:
      - 'firmware/esp32cam-rear-lidar/**'
      - 'firmware/esp32cam-rtsp-radio/overlay/src/**'
      - 'firmware/esp32cam-rtsp-radio/overlay/test/live_write_progress/**'
      - '.github/workflows/rear-camera-firmware.yml'
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check ArduinoOTA transfer and terminal acknowledgement
        run: python -m unittest discover -s firmware/esp32cam-rear-lidar -p test_upload_ota.py
      - name: Check independent video and sensor socket progress
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror firmware/esp32cam-rtsp-radio/overlay/test/live_write_progress/test_progress.cpp -o /tmp/live-write-progress
          /tmp/live-write-progress
          g++ -std=c++11 -Wall -Wextra -Werror -I firmware/esp32cam-rtsp-radio/overlay/test/live_write_progress/stubs firmware/esp32cam-rtsp-radio/overlay/test/live_write_progress/test_transport.cpp -o /tmp/live-write-transport
          /tmp/live-write-transport
      - name: Check rear-only write budget and recovery under backpressure
        run: python firmware/esp32cam-rear-lidar/test_transport_budget.py
      - name: Test receiver qualification on loopback WebSockets
        run: |
          python -m pip install 'aiohttp>=3.9,<4' 'Pillow>=10,<13'
          python -m unittest discover -s firmware/esp32cam-rear-lidar -p 'test_qualify_viewer.py'
      - run: python -m pip install platformio==6.1.19
      - run: python firmware/esp32cam-rear-lidar/prepare.py --output /tmp/rear-camera-build --build
      - name: Test disabled rear Wi-Fi ranging behavior
        run: python firmware/esp32cam-rear-lidar/test_ranging_disabled.py --prepared /tmp/rear-camera-build
      - name: Test optional BNO presence, commands, OTA pause and real SH2 deadlines
        run: python firmware/esp32cam-rear-lidar/test_bno_optional.py --prepared /tmp/rear-camera-build --asan
      - run: python firmware/esp32cam-rear-lidar/check_ota_image.py /tmp/rear-camera-build
      - name: Compile factory provisioning path with test credentials
        run: |
          python -c 'import json; json.dump({"ssid":"rear-ci-network","password":"rear-ci-only-password"},open("/tmp/rear-ci-wifi.json","w"))'
          python firmware/esp32cam-rear-lidar/prepare.py --output /tmp/rear-factory-build --provisioning-json /tmp/rear-ci-wifi.json --build
          python firmware/esp32cam-rear-lidar/check_ota_image.py /tmp/rear-factory-build --factory
      - uses: actions/upload-artifact@v4
        with:
          name: rear-camera-firmware
          path: |
            /tmp/rear-camera-build/.pio/build/esp32cam_s3_wroom_n16r8/firmware.bin
            /tmp/rear-camera-build/.pio/build/esp32cam_s3_wroom_n16r8/bootloader.bin
            /tmp/rear-camera-build/.pio/build/esp32cam_s3_wroom_n16r8/partitions.bin
            firmware/esp32cam-rear-lidar/README.md
