name: Rear camera firmware
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firmware/esp32cam-rear-lidar/**'
      - '.github/workflows/rear-camera-firmware.yml'
  push:
    branches: ['work/rear-camera-lidar-*']
    paths:
      - 'firmware/esp32cam-rear-lidar/**'
      - '.github/workflows/rear-camera-firmware.yml'
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install platformio==6.1.19
      - run: python firmware/esp32cam-rear-lidar/prepare.py --output /tmp/rear-camera-build --build
      - uses: actions/upload-artifact@v4
        with:
          name: rear-camera-firmware
          path: |
            /tmp/rear-camera-build/.pio/build/esp32cam_s3_wroom_n16r8/firmware.bin
            /tmp/rear-camera-build/.pio/build/esp32cam_s3_wroom_n16r8/bootloader.bin
            /tmp/rear-camera-build/.pio/build/esp32cam_s3_wroom_n16r8/partitions.bin
            firmware/esp32cam-rear-lidar/README.md
