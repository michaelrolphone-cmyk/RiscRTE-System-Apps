name: T061 home qualification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 6a3b3d46f5b2857eacc6e9863799dec1f466b036
          path: .source/runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-XTEINK-X4-PRO
          ref: 93ee386b7e23628f3776edc6cfd2805cf675d649
          path: .source/x4
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: e80172353fcb9e6519ca9d9b2a4d43c69c1bc91d
          path: .source/utilities
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: c98e4222048244b1e729869ed47aa99130025fd3
          path: .source/reader
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Drivers
          ref: 5890721073ebabd781d5d278e447c761947a5c58
          path: .source/drivers
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verified Python dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t061-home"
          python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --no-deps -r scripts/requirements-t061.txt 2>&1 | tee "$RUNNER_TEMP/t061-home/python-dependencies.log"
          python -c 'from PIL import Image; import PIL; assert PIL.__version__ == "12.3.0"'
      - name: Verified selected GCC8 compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/t061-toolchain"
          cd "$RUNNER_TEMP/t061-toolchain"
          curl --fail --location --retry 3 --output gcc8.tar.gz https://github.com/espressif/crosstool-NG/releases/download/esp-2021r2-patch5/xtensa-esp32s3-elf-gcc8_4_0-esp-2021r2-patch5-linux-amd64.tar.gz
          test "$(stat -c %s gcc8.tar.gz)" = 68099473
          echo '8aa17a6adf01efa5b1628c8ac578063a44d26ae9581d39486b92223a41ef262f  gcc8.tar.gz' | sha256sum --check
          tar -xzf gcc8.tar.gz
          echo "T061_CC=$PWD/xtensa-esp32s3-elf/bin/xtensa-esp32s3-elf-gcc" >> "$GITHUB_ENV"
      - name: Normal, sanitized and repeated target qualification
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qualify_t061.py --dependencies .source --compiler "$T061_CC" --output "$RUNNER_TEMP/t061-home"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t061-home-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/t061-home/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
