name: X4 renderer allocation regression
on:
  pull_request:
  push:
    branches: [fix/x4-render-performance]
jobs:
  pixel-equivalence-and-allocations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact pixels and bounded allocations
        run: python3 scripts/test_springboard_header_cost.py --snapshot --output /tmp/header
      - name: Sanitized exact pixels and bounded allocations
        run: python3 scripts/test_springboard_header_cost.py --snapshot --sanitize --output /tmp/header-sanitized
