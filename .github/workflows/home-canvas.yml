name: Common Home Canvas
on:
  pull_request:
    paths: ['lib/PortableApps/include/PortableHomeCanvas.h', 'test/home_canvas/**', 'scripts/test_home_canvas.py', 'Services/canvas_host/**', 'sdk/app/RiscCanvasV1.h', '.github/workflows/home-canvas.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: python3 scripts/test_home_canvas.py --output out/home-canvas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-canvas-${{ github.event.pull_request.head.sha }}
          path: out/
