name: Calculator native input ownership
on: [push, pull_request]
jobs:
  ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/test_calculator_native_input.py
      - run: python3 scripts/test_calculator_native_optout.py
