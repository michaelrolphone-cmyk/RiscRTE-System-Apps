name: Shared route integrity
on:
  push:
    branches: ['work/content-addressed-routes-20261108']
  pull_request:
    paths:
      - 'scripts/assemble_shared_home_cohort.py'
      - 'scripts/prepare_home_cohort_plan.py'
      - 'scripts/repair_shared_external_routes.py'
      - 'scripts/test_external_image_routes.py'
      - 'scripts/test_route_only_repair.py'
      - '.github/workflows/shared-route-integrity.yml'
permissions:
  contents: read
jobs:
  source-regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Qualify route, preservation and composition contracts
        run: |
          python3 scripts/test_shared_app_cohort.py
          python3 scripts/test_shared_home_cohort.py
          python3 scripts/test_external_image_routes.py
          python3 scripts/test_route_only_repair.py
