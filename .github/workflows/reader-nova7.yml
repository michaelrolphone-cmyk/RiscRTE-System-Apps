name: Reader NOVA-7 scene qualification
on:
  push:
    branches: [feat/reader-nova7-gui]
  pull_request:
    paths:
      - Services/scene_host/**
      - sdk/app/**
      - test/scene/**
      - scripts/scene_sdk.py
      - scripts/test_scene_components.py
      - .github/workflows/reader-nova7.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scene:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 536e01a36461d2e66bdfa735186c1d02267b3fb7
          path: Runtime
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate and verify telemetry typography
        run: |
          python -m pip install Pillow==12.3.0
          echo '928e6c01d863767a2fbb641963a8c9f63e76243c95d52208caaa62961909f7a6  Services/scene_host/fonts/telemetry.inc' | sha256sum --check
          cp Services/scene_host/fonts/telemetry.inc "$RUNNER_TEMP/qualified-telemetry.inc"
          python scripts/generate_telemetry_fonts.py
          echo '2d7501e42d6223ebbc191817715431182c435fea944a1a02166a0748a577eaf1  Services/scene_host/fonts/telemetry.inc' | sha256sum --check
          # Provenance comments differ; every glyph declaration must still match.
          cmp <(tail -n +2 "$RUNNER_TEMP/qualified-telemetry.inc") <(tail -n +2 Services/scene_host/fonts/telemetry.inc)
          cp "$RUNNER_TEMP/qualified-telemetry.inc" Services/scene_host/fonts/telemetry.inc
          git diff --exit-code
      - name: Verify shared components and all presenter lifecycles
        run: |
          set -euo pipefail
          mkdir -p /tmp/reader-evidence
          git rev-parse HEAD > /tmp/reader-evidence/source-commit.txt
          python scripts/test_scene_components.py --runtime Runtime | tee /tmp/reader-evidence/components.log
          python scripts/test_scene_host.py --runtime Runtime | tee /tmp/reader-evidence/lifecycles.log
      - name: Compile and structurally validate Xtensa modules
        run: |
          set -euo pipefail
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
          python scripts/build_scene_services.py --runtime Runtime --output /tmp/reader-scene
      - uses: actions/upload-artifact@v4
        with:
          name: reader-scene-041
          path: |
            /tmp/reader-scene/scene-host/
            /tmp/reader-evidence/
          retention-days: 14
