name: ESP32-S3 infrastructure modes
on:
  pull_request:
    paths:
      - 'Services/infra_node/**'
      - 'test/infra_node/**'
      - 'profiles/esp32s3-infrastructure/**'
      - 'scripts/*infrastructure*'
      - '.github/workflows/infrastructure-modes.yml'
  push:
    branches: [work/esp32-agent-modes, work/esp32-dynamic-role-allocation]
permissions:
  contents: read
concurrency:
  group: infrastructure-modes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: apps
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 889e0df02fc1efd410d7540b07cb1a8f0c48a85c
          path: runtime
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Firmware regression and sanitizers
        run: |
          bash apps/scripts/test_infrastructure.sh
          ASAN_OPTIONS=detect_leaks=0 SANITIZE=1 bash apps/scripts/test_infrastructure.sh
  target:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: apps
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 889e0df02fc1efd410d7540b07cb1a8f0c48a85c
          path: runtime
          persist-credentials: false
      - name: Build native runtime, product ELFs and verified first-install and repair images
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/apps"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/runtime"
          . "$IDF_PATH/export.sh"
          export RISC_RUNTIME_ROOT="$PWD/runtime" INFRA_OUTPUT="$PWD/package/esp32s3-infrastructure-v1.10.0"
          mkdir -p package
          bash apps/scripts/build_infrastructure_bundle.sh
          python apps/scripts/package_infrastructure_modes.py --bundle "$INFRA_OUTPUT" --runtime runtime --output package/release
      - uses: actions/upload-artifact@v4
        with:
          name: infrastructure-modes-elf-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            package/release/
          if-no-files-found: error
