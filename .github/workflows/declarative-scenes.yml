name: Declarative scene presenter
on:
  push:
    branches: [feat/declarative-alarms]
  pull_request:
    paths: ['Services/scene_*/**', 'scripts/*scene*', 'test/scene/**', '.github/workflows/declarative-scenes.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  presenter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: System
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: b70cb87bdead507b9bc826f445935c5ad2b08bad
          path: Runtime
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Presenter fault and lifecycle tests
        run: |
          set -o pipefail
          mkdir -p evidence
          python System/scripts/test_scene_host.py --runtime Runtime 2>&1 | tee evidence/host.log
          python System/scripts/test_scene_host.py --runtime Runtime --sanitize 2>&1 | tee evidence/host-sanitized.log
      - name: Install pinned target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Compile and strictly validate three target providers
        run: |
          set -o pipefail
          python System/scripts/build_scene_services.py --runtime Runtime --output packages 2>&1 | tee evidence/build.log
          git -C System rev-parse HEAD > evidence/system-commit.txt
          git -C Runtime rev-parse HEAD > evidence/runtime-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: declarative-scene-providers-${{ github.sha }}
          path: |
            evidence/
            packages/
          if-no-files-found: error
