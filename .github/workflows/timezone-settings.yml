name: Opt-in timezone Settings
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timezone-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned public compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Actual Settings controller, all catalog choices and feature-off ELF bytes
        run: >-
          python scripts/test_timezone_settings.py
          --xtensa-cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc"
          --evidence build/timezone-settings/evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: timezone-settings-proof-${{ github.sha }}
          path: |
            build/timezone-settings/evidence.json
            build/timezone-settings/*.log
          if-no-files-found: error
          retention-days: 14
