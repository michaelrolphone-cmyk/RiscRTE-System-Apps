name: Shared Settings scene qualification

on:
  pull_request:
    paths:
      - '.github/workflows/shared-settings-scene.yml'
      - 'Apps/settings_scene.c'
      - 'Services/settings_policy/**'
      - 'Services/scene_host/**'
      - 'Services/scene_profile/**'
      - 'Services/text_input/**'
      - 'Services/canvas_host/**'
      - 'lib/PortableApps/**'
      - 'lib/NativeApps/**'
      - 'lib/elf_loader/**'
      - 'sdk/**'
      - 'scripts/**settings**'
      - 'scripts/*scene*'
      - 'scripts/native_toolchain.py'
      - 'test/native_apps/**settings**'
      - 'test/native_apps/resident_policy*'
      - 'scripts/test_resident_policy.py'
      - 'test/native_apps/component_scene_client_test.c'
      - 'test/native_apps/validate_test.c'
      - 'test/native_apps/stubs/**'
      - 'test/scene/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/shared-settings-scene.yml'
      - 'Apps/settings_scene.c'
      - 'Services/settings_policy/**'
      - 'Services/scene_host/**'
      - 'Services/scene_profile/**'
      - 'Services/text_input/**'
      - 'Services/canvas_host/**'
      - 'lib/PortableApps/**'
      - 'lib/NativeApps/**'
      - 'lib/elf_loader/**'
      - 'sdk/**'
      - 'scripts/**settings**'
      - 'scripts/*scene*'
      - 'scripts/native_toolchain.py'
      - 'test/native_apps/**settings**'
      - 'test/native_apps/resident_policy*'
      - 'scripts/test_resident_policy.py'
      - 'test/native_apps/component_scene_client_test.c'
      - 'test/native_apps/validate_test.c'
      - 'test/native_apps/stubs/**'
      - 'test/scene/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-settings-scene-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-and-native-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact Runtime SDK and driver contracts
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 13eca114cb58469cf6004fafc3da84fbd9d29beb
          path: .dependencies/runtime
          persist-credentials: false
      # Same Utilities source as the published shared-Points closure.
      - name: Exact tagged Alarm service and clock-edit authority
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: e817612532beb613376d69a502cd1e11b94ac8c4
          path: .dependencies/utilities
          persist-credentials: false
      - name: Exact base display contracts
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/T5S3-Reader
          ref: 45cf61ac013fb618e8d7fed63217a35350484d52
          path: .dependencies/reader
          persist-credentials: false
      - name: Exact display metrics and snapshot contracts
        uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-XTEINK-X4-PRO
          ref: 3c32f85de9c3c80a6b085753d16744c47712172d
          path: .dependencies/x4
          persist-credentials: false
      - name: Verify and stage the four published display contracts
        run: |
          test "$(git -C .dependencies/reader rev-parse HEAD)" = 45cf61ac013fb618e8d7fed63217a35350484d52
          test "$(git -C .dependencies/x4 rev-parse HEAD)" = 3c32f85de9c3c80a6b085753d16744c47712172d
          mkdir -p .dependencies/display-sdk
          cp .dependencies/reader/sdk/driver/RiscDisplayOutputV1.h .dependencies/display-sdk/
          cp .dependencies/reader/sdk/driver/RiscDisplayOutputPowerV1.h .dependencies/display-sdk/
          cp .dependencies/x4/minimal/interfaces/RiscDisplayOutputMetricsV1.h .dependencies/display-sdk/
          cp .dependencies/x4/minimal/interfaces/RiscDisplayOutputSnapshotV1.h .dependencies/display-sdk/
          echo '99b682ba34f07e7868dec8e78dfb816c067fdc184e647033bc6ed8d489b9c9a2  .dependencies/display-sdk/RiscDisplayOutputV1.h' | sha256sum -c -
          echo 'e9c7d3bd3ddf9bce128503aafb5669734db09424149f45b3a6f735cd5a7c8667  .dependencies/display-sdk/RiscDisplayOutputPowerV1.h' | sha256sum -c -
          echo '5be17adbae2ec26a855894e0d6443ac29572002c21efe53b2a913a5a0f0c642d  .dependencies/display-sdk/RiscDisplayOutputMetricsV1.h' | sha256sum -c -
          echo 'b835fd1a3600551d54efb2806cbe8dd3ecc512a538572dc853aaf11f4e2490b6  .dependencies/display-sdk/RiscDisplayOutputSnapshotV1.h' | sha256sum -c -
      - name: Verify dependency pins and stage flat Runtime app SDK
        run: |
          test "$(git -C .dependencies/runtime rev-parse HEAD)" = 13eca114cb58469cf6004fafc3da84fbd9d29beb
          test "$(git -C .dependencies/utilities rev-parse HEAD)" = e817612532beb613376d69a502cd1e11b94ac8c4
          mkdir -p .dependencies/runtime-sdk
          cp .dependencies/runtime/sdk/app/*.h .dependencies/runtime-sdk/
          test -f .dependencies/runtime-sdk/RiscRealtimeV1.h
      - name: Settings model normal and ASan/UBSan
        run: |
          python3 scripts/test_settings_model.py --runtime-sdk .dependencies/runtime-sdk
          python3 scripts/test_settings_model.py --runtime-sdk .dependencies/runtime-sdk --sanitize
      - name: Checked scene custody and semantic/app-loop regressions
        run: |
          python3 scripts/test_component_scene_client.py
          python3 scripts/test_portable_settings_scene.py --runtime-sdk .dependencies/runtime-sdk
          python3 scripts/test_settings_scene_app.py --runtime-sdk .dependencies/runtime-sdk --alarm-include .dependencies/utilities/lib/Alarm/include
      - name: Actual Settings Runtime and actual Alarm service
        run: >-
          python3 scripts/test_shared_settings_runtime.py
          --runtime .dependencies/runtime
          --driver-sdk .dependencies/runtime/sdk/driver
          --sdk .dependencies/runtime-sdk
          --utilities .dependencies/utilities
          --output dist/shared-settings/runtime
      - name: Published Runtime resident POLICY consumes saved idle and deep timers
        run: |
          mkdir -p dist/shared-settings/resident-policy
          python3 scripts/test_resident_policy.py \
            --runtime .dependencies/runtime \
            --display-sdk .dependencies/display-sdk \
            --alarm-sdk .dependencies/utilities/lib/Alarm/include \
            --modes settings-reload 2>&1 | tee dist/shared-settings/resident-policy/normal.log
          python3 scripts/test_resident_policy.py \
            --runtime .dependencies/runtime \
            --display-sdk .dependencies/display-sdk \
            --alarm-sdk .dependencies/utilities/lib/Alarm/include \
            --sanitize --modes settings-reload 2>&1 | tee dist/shared-settings/resident-policy/sanitized.log
      # Drivers badge/bulk-continuation-2026-10-28 board1.75C profile:
      # 466x466, round, 69px safe insets. These are bring-up mathematical
      # insets, not measured hardware acceptance. No --quick: all 419 zones
      # are traversed on all seven native/provider geometry lanes.
      - name: Actual scene host all seven lanes and complete zone catalog
        run: >-
          python3 scripts/test_settings_scene_host.py
          --runtime-sdk .dependencies/runtime-sdk
          --round-side 466 --round-inset 69
          --output dist/shared-settings/scene-host
      - name: Actual scene host all seven lanes under ASan/UBSan
        run: >-
          python3 scripts/test_settings_scene_host.py
          --runtime-sdk .dependencies/runtime-sdk
          --round-side 466 --round-inset 69 --sanitize
          --output dist/shared-settings/scene-host-sanitized
      - name: Preserve host evidence, including failed lanes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-settings-host-${{ github.sha }}
          path: dist/shared-settings/
          if-no-files-found: warn
          retention-days: 14

  canonical-target-repeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 13eca114cb58469cf6004fafc3da84fbd9d29beb
          path: .dependencies/runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: e817612532beb613376d69a502cd1e11b94ac8c4
          path: .dependencies/utilities
          persist-credentials: false
      # Reuses the pinned public compiler setup in Utilities e8176125
      # .github/workflows/alarm-abi.yml; no unverified download URL.
      - name: Pinned public ESP32-S3 compiler
        run: |
          python3 -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Verify pins and stage flat Runtime app SDK
        run: |
          test "$(git -C .dependencies/runtime rev-parse HEAD)" = 13eca114cb58469cf6004fafc3da84fbd9d29beb
          test "$(git -C .dependencies/utilities rev-parse HEAD)" = e817612532beb613376d69a502cd1e11b94ac8c4
          mkdir -p .dependencies/runtime-sdk
          cp .dependencies/runtime/sdk/app/*.h .dependencies/runtime-sdk/
          echo "NATIVE_APP_CC=$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" >> "$GITHUB_ENV"
      - name: Repeat-build the canonical target ELF and structurally validate
        run: >-
          python3 scripts/build_settings_scene.py
          --runtime-sdk .dependencies/runtime-sdk
          --utilities .dependencies/utilities
          --output dist/shared-settings/canonical-target
      - name: Repeat-build all three explicit Settings policy providers
        run: |
          for policy in Services/settings_policy/profiles/*.json; do
            name="$(basename "$policy" .json)"
            python3 scripts/build_settings_policy.py \
              --runtime-sdk .dependencies/runtime-sdk \
              --driver-sdk .dependencies/runtime/sdk/driver \
              --utilities .dependencies/utilities \
              --policy "$policy" \
              --output "dist/shared-settings/policies/$name"
          done
      - name: Preserve repeat-build and loader evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-settings-target-${{ github.sha }}
          path: |
            dist/shared-settings/canonical-target/
            dist/shared-settings/policies/
          if-no-files-found: warn
          retention-days: 14
