name: Paper Quick complete labels
on:
  pull_request:
  push:
    branches: [main, work/paper-label-fit-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 1c1ed8661ea30d47e7e9707c41d492ce3a2b4d70
          path: .paper-deps/runtime
          sparse-checkout: sdk/app
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-XTEINK-X4-PRO
          ref: a9009a5d774ae7060b9f298fdcbc81be6c22cc17
          path: .paper-deps/display
          sparse-checkout: minimal/t039/profile/target-x4/sdk/include
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Complete native label masks and modal input preservation
        run: >-
          python scripts/test_paper_label_fit.py
          --runtime-sdk .paper-deps/runtime/sdk/app
          --display-sdk .paper-deps/display/minimal/t039/profile/target-x4/sdk/include
          --output build/paper-label-fit-ci
      - uses: actions/upload-artifact@v4
        with:
          name: paper-label-fit-evidence
          path: build/paper-label-fit-ci
