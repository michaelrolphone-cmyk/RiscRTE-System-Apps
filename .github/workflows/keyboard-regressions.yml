name: Shared keyboard regression qualification
on:
  push:
    branches: [fix/shared-keyboard-current-20261012]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keyboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 1c1ed8661ea30d47e7e9707c41d492ce3a2b4d70
          path: .deps/x4-runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 267aab6d9382ce4921a1536fab1620749b2f5301
          path: .deps/watch-runtime
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reproduce pinned telemetry glyphs
        run: |
          python -m pip install Pillow==12.3.0
          python scripts/verify_telemetry_fonts.py
          git diff --exit-code
      - name: Qualify shared input, visibility, privacy and preserved scene behavior
        run: |
          set -euo pipefail
          mkdir evidence
          python scripts/test_scene_host.py --runtime .deps/x4-runtime 2>&1 | tee evidence/scene-normal.log
          python scripts/test_scene_host.py --runtime .deps/x4-runtime --sanitize 2>&1 | tee evidence/scene-sanitized.log
          python scripts/test_scene_components.py --runtime .deps/x4-runtime 2>&1 | tee evidence/components.log
          python scripts/test_scene_telemetry.py --runtime .deps/x4-runtime 2>&1 | tee evidence/telemetry.log
          python scripts/test_text_input_host.py --runtime .deps/x4-runtime --decoupled-attention --sanitize --output build/text-host 2>&1 | tee evidence/text-host.log
          python scripts/test_text_input_runtime.py --runtime .deps/x4-runtime --paper --sanitize --output build/x4-runtime 2>&1 | tee evidence/x4-runtime.log
          python scripts/test_text_input_runtime.py --runtime .deps/watch-runtime --sanitize --output build/watch-runtime 2>&1 | tee evidence/watch-runtime.log
      - name: Build paired scene and text providers
        run: |
          set -euo pipefail
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
          python scripts/build_text_input_services.py --runtime .deps/x4-runtime --output dist/keyboard 2>&1 | tee evidence/target.log
          git rev-parse HEAD > evidence/published-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: shared-keyboard-pair
          path: |
            dist/keyboard/
            evidence/
          retention-days: 14
