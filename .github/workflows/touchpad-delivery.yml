name: Shared Touchpad cumulative delivery
on:
  push:
    branches: ['work/shared-touchpad-pointer-20261103']
  pull_request:
    paths: ['scripts/assemble_touchpad_delivery.py', '.github/workflows/touchpad-delivery.yml']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: System
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: ab9ff33975680c5bb8d9a2e7ed346d0300732a4e
          path: Bootfs
          persist-credentials: false
      - name: Inspect immutable cumulative product authority
        run: python3 System/scripts/assemble_touchpad_delivery.py --bootfs-tools Bootfs/scripts --output evidence/baseline --inspect-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touchpad-baseline-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
