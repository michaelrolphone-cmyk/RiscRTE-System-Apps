name: Shared settings SD safety
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-settings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 70da873a2b5f35ab23f59f19449008b0683b60ee
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiskRTE-XTEINK-X4-PRO
          ref: c8a4f951abccd2e88660468958621612c82083c3
          path: x4
          persist-credentials: false
      - name: Shared checkpoint, ABI and cancellation fixtures
        env:
          RUNTIME_REPO: ${{ github.workspace }}/runtime
        run: |
          bash scripts/test_shared_settings.sh
          SANITIZE=1 bash scripts/test_shared_settings.sh
          bash scripts/test_installed_apps_service.sh
          SANITIZE=1 bash scripts/test_installed_apps_install.sh
          SANITIZE=1 bash scripts/test_installed_catalog_client.sh
      - name: Files and WebDAV reserved-path regression
        run: |
          SANITIZE=1 bash scripts/test_protected_settings.sh
          python scripts/test_file_browser_operations.py
          SANITIZE=1 bash scripts/test_webdav_volume.sh
          SANITIZE=1 bash scripts/test_webdav_core.sh
          SANITIZE=1 bash scripts/test_webdav_peer.sh
      - name: Shared preference BUSY hydration
        env:
          RUNTIME_REPO: ${{ github.workspace }}/runtime
          X4_REPO: ${{ github.workspace }}/x4
        run: python scripts/test_shared_settings_hydration.py
      - name: Install pinned public compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build provider and record composition evidence
        run: python scripts/build_installed_apps.py --runtime-repo ../runtime --output-dir build/shared-settings-provider
      - uses: actions/upload-artifact@v4
        with:
          name: shared-settings-source-validation-${{ github.sha }}
          path: source/build/shared-settings-provider
          if-no-files-found: error
          retention-days: 7
