name: Publish tested X4 Home boot repair
on:
  push:
    branches: [fix/x4-home-alarm-progress-20261012]
    paths: [.github/workflows/publish-x4-home-boot-fix.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/x4-home-alarm-progress-20261012
      - name: Apply reconciled source-hash-checked production edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('lib/PortableApps/src/sparse_clock_adapter.inc')
          s=p.read_text()
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='db3ed9fee2b4d54e2c6c4c80a2b84a304f113890d1107eb6d204719abe4d93c3'
          old='rc!=RISC_KEY_VALUE_INVALID && rc!=RISC_KEY_VALUE_IO)portable_desk_adapter_retain();'
          assert s.count(old)==1
          s=s.replace(old,'rc!=RISC_KEY_VALUE_INVALID && rc!=RISC_KEY_VALUE_IO && rc!=RISC_KEY_VALUE_BUSY)portable_desk_adapter_retain();')
          s=s.replace('static int32_t desk_kv_result(int32_t rc) {','''static int32_t desk_kv_result(int32_t rc) {
           /* BUSY means no I/O began. Native settings discovery/checkpoint work may
            * still be running at cold start; keep cached values and permit retry.
            * CONTEXT and unknown results still fence this exact invocation. */''')
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='f08d7597195f9766ddaf427f2d33c45048a9945582fe410ef862f8286cdb6a99'
          p=Path('lib/PortableApps/src/alarm.inc');s=p.read_text()
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='2450456a78afc8a0c1d0dea70c2bb417e1f71357d19abf734600d0c913e79459'
          start=s.index('#ifdef PORTABLE_ALARM_BUSY_DEFER\n/* LOADING defers logical input')
          end=s.index('/* Returns false only on foreground failure; consumed prevents initiating Back',start)
          s=s[:start]+'''#ifdef PORTABLE_ALARM_BUSY_DEFER
          /* Deferring alarm reconciliation consumes input, not the owner's scheduler or
           * sealed frame. In particular, the cold boot animation waits on that frame.
           * Returning without these checkpoints starves it until its timeout, and fini
           * becomes the first place that ever submits the queued pixels. No alarm or
           * storage lease crosses this cooperative boundary. */
          static bool alarm_loading_checkpoint(bool *consumed) {
              *consumed=true;
              input_service();
              if(failed || native_sleep_retained)return false;
              rt->yield_ms(1);
              if(failed || native_sleep_retained)return false;
              if(!paper_present_progress())return alarm_failure();
              return !failed && !native_sleep_retained;
          }
          #endif
          '''+s[end:]
          assert s.count('return alarm_defer_loading(consumed);')==2
          s=s.replace('return alarm_defer_loading(consumed);','return alarm_loading_checkpoint(consumed);')
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='371a8b2162a5799424185df9c77adf58563f792cbe78763c6f0c7913adf39847'
          PY
          git diff --check
          git add lib/PortableApps/src/sparse_clock_adapter.inc lib/PortableApps/src/alarm.inc
          git rm .github/workflows/publish-x4-home-boot-fix.yml
          git -c user.name='ChatGPT' -c user.email='chatgpt@users.noreply.github.com' commit -m 'Fix cold Home settings BUSY retention and preserve alarm-deferred frame progress'
          git push origin HEAD:refs/heads/fix/x4-home-alarm-progress-20261012
          git rev-parse HEAD
