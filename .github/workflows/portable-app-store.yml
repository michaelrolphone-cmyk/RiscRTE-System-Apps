name: Portable App Store
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-app-store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify portable services and controller fault paths
        run: python scripts/test_portable_update.py
      - name: Install pinned public compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build App Store target and check unchanged legacy bytes
        run: |
          python scripts/build_portable_updates.py --app app_store --rtc-utc-offset-seconds 28800 --wifi-instance 15 --alarm-client --navigation --full-frames
          python scripts/build_all_apps.py
          python scripts/check_release_parity.py
      - uses: actions/upload-artifact@v4
        with:
          name: portable-app-store-${{ github.sha }}
          path: dist/portable/updates/
          if-no-files-found: error
          retention-days: 14
