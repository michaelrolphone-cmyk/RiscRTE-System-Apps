name: Publish Reader link scene source
on:
  push:
    branches: [feat/reader-nova7-gui]
    paths: [.github/workflows/reader-links-source.yml]
permissions:
  contents: read
jobs:
  apply:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply tested source delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 8ddd9bcf751cecfcf74a67c50c809b87ec75fcc3 HEAD -- Services scripts sdk test
          python3 - <<'PY'
          import base64,zlib,hashlib
          from pathlib import Path
          encoded=''
          patch=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='73cf132c60070a7207b7810f5341865a4689e84b9bb56bdbf5d2ee59ff59a624'
          Path('/tmp/links.patch').write_bytes(patch)
          PY
          git apply --check /tmp/links.patch
          git apply --index /tmp/links.patch
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Add copied reading-link regions and physical touch routing (scene 0.3.6)'
          git push origin HEAD:feat/reader-nova7-gui
