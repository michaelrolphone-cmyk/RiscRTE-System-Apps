name: Watch Wi-Fi touch responsiveness
on:
  pull_request:
    paths:
      - 'Apps/wifi_settings*'
      - 'lib/PortableApps/**'
      - 'test/native_apps/*wifi*'
      - 'scripts/test_wifi_watch_touch.py'
      - '.github/workflows/watch-wifi-touch.yml'
  push:
    branches: [main, fix/wifi-touch-responsiveness-20261017]
    paths:
      - 'Apps/wifi_settings*'
      - 'lib/PortableApps/**'
      - 'test/native_apps/*wifi*'
      - 'scripts/test_wifi_watch_touch.py'
      - '.github/workflows/watch-wifi-touch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  touch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native Watch footer and existing workflow controls
        run: |
          python3 scripts/test_wifi_watch_touch.py --output build/watch-touch/normal
          python3 scripts/test_wifi_watch_touch.py --sanitize --output build/watch-touch/sanitized
          python3 scripts/test_wifi_workflow.py --output build/watch-touch/workflow-normal
          python3 scripts/test_wifi_workflow.py --sanitize --output build/watch-touch/workflow-sanitized
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watch-wifi-touch-evidence
          path: |
            build/watch-touch/**/*.json
            build/watch-touch/**/*.log
