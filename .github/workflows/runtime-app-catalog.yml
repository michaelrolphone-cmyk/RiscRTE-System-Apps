name: Runtime catalog and reproducible shared UI
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Apps/**'
      - 'lib/**'
      - 'scripts/test_runtime_*catalog*.py'
      - 'scripts/prove_shared_catalog_target.py'
      - 'test/native_apps/**'
      - '.github/workflows/runtime-app-catalog.yml'
  push:
    paths:
      - 'Apps/**'
      - 'lib/**'
      - 'scripts/test_runtime_*catalog*.py'
      - 'scripts/prove_shared_catalog_target.py'
      - 'test/native_apps/**'
      - '.github/workflows/runtime-app-catalog.yml'
permissions:
  contents: read
jobs:
  catalog-and-target-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Watch
          ref: 6e82fdcaec0b73ed700d2104cfb4d94f011c19d4
          path: .ci-deps/watch-bridge
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: c258c4ba144247b6eaa4c6f28675ffccec582fe1
          path: .ci-deps/catalog-native
          persist-credentials: false
      - name: Catalog, retention, stale launches and Contexts
        run: |
          python scripts/test_runtime_app_catalog.py
          python scripts/test_runtime_context_catalog.py
          python scripts/test_catalog_native_integration.py --runtime .ci-deps/catalog-native
      - name: Install pinned public compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Reproduce pinned baseline and final default/atomic shared UI bytes
        run: |
          python scripts/prove_shared_catalog_target.py \
            --compiler "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" \
            --bridges .ci-deps/watch-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-catalog-${{ github.sha }}
          path: |
            build/runtime-app-catalog/result.json
            build/runtime-app-catalog/generic-target/
          if-no-files-found: error
          retention-days: 14
