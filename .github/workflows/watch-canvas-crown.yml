name: Watch canvas native crown exit
on:
  push:
    branches: [fix/watch-canvas-crown]
  workflow_dispatch:
env:
  PLATFORMIO_SETTING_ENABLE_TELEMETRY: "no"
permissions:
  contents: read
jobs:
  native-crown:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test persistent exit and unchanged modal cleanup
        run: |
          python scripts/test_watch_canvas_crown_exit.py
          python scripts/test_portable_alarm.py
          python scripts/test_quick_actions.py
      - name: Install pinned public target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build and validate target Settings spot check
        run: |
          python scripts/build_portable_settings.py --low-battery --nova-ui --alarm-settings --navigation --full-frames --output-dir dist/watch-canvas-crown/settings
      - uses: actions/upload-artifact@v4
        with:
          name: watch-canvas-crown-${{ github.sha }}
          path: dist/watch-canvas-crown/
          if-no-files-found: error
          retention-days: 14
