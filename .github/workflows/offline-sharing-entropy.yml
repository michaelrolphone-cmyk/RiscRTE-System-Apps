name: Offline sharing entropy
on:
  push:
    branches: [fix/entropy-offline-bootstrap]
  pull_request:
    paths:
      - 'Apps/file_browser*'
      - 'lib/RemoteFiles/PortablePeerFiles.cpp'
      - 'test/native_apps/file_browser*'
      - 'test/remote_files/peer_controller_fixture.inc'
      - '.github/workflows/offline-sharing-entropy.yml'
permissions:
  contents: read
jobs:
  sharing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 3a071a9b5d9878dfadf999506b6f335a099b3639
          path: runtime
          persist-credentials: false
      - name: Initially-off offline sharing and peer cleanup
        working-directory: system
        run: |
          python3 tests/test_file_sharing_build.py
          bash scripts/test_file_browser_direct.sh
          SANITIZE=1 bash scripts/test_file_browser_direct.sh
          bash scripts/test_webdav_peer.sh
          SANITIZE=1 bash scripts/test_webdav_peer.sh
          bash scripts/test_file_browser_peer.sh
          SANITIZE=1 bash scripts/test_file_browser_peer.sh
          bash scripts/test_file_sharing_client.sh
          SANITIZE=1 bash scripts/test_file_sharing_client.sh
          bash scripts/test_portable_file_setup.sh
