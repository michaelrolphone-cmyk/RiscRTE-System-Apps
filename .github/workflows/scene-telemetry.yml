name: Scene telemetry qualification
on:
  push:
    branches: [feat/obd-telemetry-scene]
  pull_request:
    paths: ['Services/scene_host/**', 'sdk/app/**', 'scripts/*telemetry*', 'scripts/scene_sdk.py', 'test/scene/**', '.github/workflows/scene-telemetry.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  telemetry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 8d713b52edca004e1d53bf30a1c584859fe33d14
          path: Runtime
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Regenerate exact typography from existing repository sources
        run: |
          set -euo pipefail
          python -m pip install Pillow==12.3.0
          python scripts/generate_telemetry_fonts.py
          echo '2d7501e42d6223ebbc191817715431182c435fea944a1a02166a0748a577eaf1  Services/scene_host/fonts/telemetry.inc' | sha256sum --check
          git diff --exit-code
      - name: Test actual telemetry presenter and existing Reader/lifecycle behavior
        run: |
          set -euo pipefail
          mkdir evidence
          python scripts/test_scene_telemetry.py --runtime Runtime 2>&1 | tee evidence/telemetry.log
          python scripts/test_scene_components.py --runtime Runtime 2>&1 | tee evidence/components.log
          python scripts/test_scene_host.py --runtime Runtime 2>&1 | tee evidence/lifecycles.log
      - name: Compile ESP32-S3 scene and verify historical 0.4.0 when selected
        run: |
          set -euo pipefail
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
          python scripts/build_scene_services.py --runtime Runtime --output build/scene 2>&1 | tee evidence/target.log
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          m=json.loads(Path('build/scene/scene-host/manifest.json').read_text())
          assert m==json.loads(Path('Services/scene_host/manifest.json').read_text())
          if m['version']=='0.4.0':
              assert hashlib.sha256(Path('build/scene/scene-host/driver.elf').read_bytes()).hexdigest()=='3236d9806b266e7e19d2c50f6f589b034fd231cdc586b1cf433ab83b0e66c173'
          PY
          git rev-parse HEAD > evidence/published-source.txt
      - uses: actions/upload-artifact@v4
        with:
          name: scene-telemetry-${{ github.sha }}
          path: |
            build/scene/scene-host/driver.elf
            build/scene/scene-host/manifest.json
            build/scene/scene-host/build.json
            build/scene/scene-host/licenses/
            evidence/
          retention-days: 14
