name: Native Wi-Fi Manager
on:
  push:
    branches: [feat/wifi-scene-manager]
    paths: ['Apps/wifi_manager/**', 'Apps/native/wifi_settings.json', 'Services/scene_host/**', 'Services/text_input/**', 'sdk/app/**', 'scripts/*wifi_manager*', 'scripts/*shared_wifi*', 'test/shared_wifi/**', 'docs/shared-wifi/**', 'test/wifi_manager/**', '.github/workflows/wifi-manager.yml']
  pull_request:
    paths: ['Apps/wifi_manager/**', 'Apps/native/wifi_settings.json', 'Services/scene_host/**', 'Services/text_input/**', 'sdk/app/**', 'scripts/*wifi_manager*', 'scripts/*shared_wifi*', 'test/shared_wifi/**', 'docs/shared-wifi/**', 'test/wifi_manager/**', '.github/workflows/wifi-manager.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wifi:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 712ecc3f894dba99d9c9638941778a82f5856b97
          path: Runtime
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify current main shared typography
        run: |
          echo '928e6c01d863767a2fbb641963a8c9f63e76243c95d52208caaa62961909f7a6  Services/scene_host/fonts/telemetry.inc' | sha256sum --check
      - name: Exercise actual app, scene and shared keyboard
        run: |
          set -euo pipefail
          mkdir evidence
          python scripts/test_wifi_manager.py --runtime Runtime --output build/wifi-tests 2>&1 | tee evidence/wifi.log
          python scripts/test_wifi_manager.py --runtime Runtime --output build/wifi-asan --sanitize 2>&1 | tee evidence/wifi-sanitized.log
          python scripts/test_scene_components.py --runtime Runtime 2>&1 | tee evidence/components.log
          python scripts/test_scene_telemetry.py --runtime Runtime 2>&1 | tee evidence/telemetry.log
          python scripts/test_scene_host.py --runtime Runtime 2>&1 | tee evidence/lifecycles.log
          python scripts/test_text_input_host.py --runtime Runtime --output build/text-tests --decoupled-attention 2>&1 | tee evidence/text-input.log
      - name: Compile ESP32-S3 app and both shared services
        run: |
          set -euo pipefail
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
          python scripts/build_wifi_manager.py --runtime Runtime --output build/wifi-manager 2>&1 | tee evidence/app-build.log
          python scripts/build_text_input_services.py --runtime Runtime --output build/providers 2>&1 | tee evidence/provider-build.log
          git rev-parse HEAD > evidence/source.txt
          sha256sum build/wifi-manager/wifi_settings.elf build/providers/presentation/scene-host/driver.elf build/providers/text-input-host/driver.elf > evidence/SHA256SUMS.txt
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wifi-manager-shared-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/wifi-manager/
            build/providers/presentation/scene-host/
            build/providers/text-input-host/
            build/wifi-tests/frames/behavior/
            evidence/
          retention-days: 14

  product-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 710b200021b983ea55eb86a6fbddbbf5ce10a984
          path: PinnedSystem
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: ab9ff33975680c5bb8d9a2e7ed346d0300732a4e
          path: Bootfs
          persist-credentials: false
      - name: Test product preservation gate
        run: python3 scripts/test_shared_wifi_products.py
      - name: Inspect published Wi-Fi product contracts
        run: python3 scripts/inspect_shared_wifi_baseline.py --system PinnedSystem --bootfs-tools Bootfs/scripts --output build/shared-wifi-baseline
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-wifi-product-baseline-${{ github.event.pull_request.head.sha || github.sha }}
          path: build/shared-wifi-baseline/
          if-no-files-found: error
