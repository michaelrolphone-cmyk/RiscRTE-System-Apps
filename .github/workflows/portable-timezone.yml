name: Isolated portable timezone core
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timezone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned public compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Pure policy, preference faults, sanitizers, independent oracle and real ELF validator
        run: >-
          python scripts/test_portable_timezone.py
          --xtensa-cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc"
          --evidence build/timezone/evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: portable-timezone-proof-${{ github.sha }}
          path: build/timezone/evidence.json
          if-no-files-found: error
          retention-days: 14
      - name: Explicit RTC interpretation records
        run: python scripts/test_rtc_basis.py
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 341e6e38ce00b7c57d5daaf5f8c829c3575db931
          path: .shared/runtime
      - name: Opt-in native realtime client and pinned target ELF
        run: >-
          python scripts/test_portable_realtime.py
          --runtime-repo .shared/runtime
          --xtensa-cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc"
          --evidence build/timezone/realtime-client.json
      - uses: actions/upload-artifact@v4
        with:
          name: portable-realtime-proof-${{ github.sha }}
          path: build/timezone/realtime-client.json
          if-no-files-found: error
          retention-days: 14
      - name: Explicit checked Set Time and pinned target ELF
        run: >-
          python scripts/test_portable_set_time.py
          --runtime-repo .shared/runtime
          --xtensa-cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc"
          --evidence build/timezone/set-time-client.json
      - uses: actions/upload-artifact@v4
        with:
          name: portable-set-time-proof-${{ github.sha }}
          path: build/timezone/set-time-client.json
          if-no-files-found: error
          retention-days: 14
