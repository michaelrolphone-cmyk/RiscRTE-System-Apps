name: Native Firmware Update qualification
on:
  pull_request:
    paths:
      - 'Apps/ota_update*'
      - 'Apps/update*'
      - 'lib/PortableApps/**'
      - 'lib/NativeApps/**'
      - 'lib/elf_loader/**'
      - 'Services/update/**'
      - 'profiles/native-firmware-update/**'
      - 'scripts/*firmware_update*'
      - 'scripts/*app_store*'
      - 'scripts/native_toolchain.py'
      - 'scripts/test_portable_update.py'
      - 'scripts/test_watch_updates_native_layout.py'
      - 'scripts/report_native_settings_memory.py'
      - 'test/native_apps/**'
      - 'docs/shared-app-crashes/replay/wave.json'
      - '.github/workflows/native-firmware-update.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-firmware-update-${{ github.ref }}
  cancel-in-progress: false
jobs:
  controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: normal
            flags: ''
          - mode: sanitized
            flags: '--sanitize'
          - mode: snapshot
            flags: '--snapshot'
          - mode: snapshot-sanitized
            flags: '--snapshot --sanitize'
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 48229bd1593a2e24e95bf4537b495ee615990fd3
          path: runtime
          persist-credentials: false
      - name: Actual firmware controller, raster, input and custody
        run: python3 scripts/test_native_firmware_update.py --runtime ../runtime --output build/native-firmware-update/controller/${{ matrix.mode }} ${{ matrix.flags }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-native-controller-${{ matrix.mode }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: source/build/native-firmware-update/controller/${{ matrix.mode }}/
          retention-days: 14
          if-no-files-found: error
  qualify:
    needs: controller
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
      PYTHONUNBUFFERED: '1'
    defaults:
      run:
        working-directory: source
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 48229bd1593a2e24e95bf4537b495ee615990fd3
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Watch
          ref: 6e82fdcaec0b73ed700d2104cfb4d94f011c19d4
          path: bridges
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06
          ref: b9862e1379813a0914d4926ef59a3feb6fcf656a
          path: profile-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: e80172353fcb9e6519ca9d9b2a4d43c69c1bc91d
          path: utilities
          persist-credentials: false
      - name: Paired cohort, service, cleanup and legacy-controller regressions
        run: python3 scripts/test_native_firmware_update_regressions.py --output build/native-firmware-update/regressions
      - name: Firmware native Quick/alarm composition
        run: |
          python3 scripts/test_native_firmware_update_overlays.py --runtime ../runtime --output build/native-firmware-update/overlays-normal
          python3 scripts/test_native_firmware_update_overlays.py --runtime ../runtime --sanitize --output build/native-firmware-update/overlays-sanitized
      - name: App Store sibling controller preservation
        run: python3 scripts/test_native_app_store.py --runtime ../runtime --output build/native-firmware-update/appstore
      - name: Install pinned public target compiler
        run: |
          python3 -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Exact recipe and target negative controls
        run: python3 scripts/test_native_firmware_update_target.py
      - name: Twelve explicit-selector-off byte preservation witnesses
        run: python3 scripts/test_native_app_store_opt_out.py --xtensa-cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" --output build/native-firmware-update/optout
      - name: Full retained updater recipes with native UI deselected
        run: python3 scripts/test_native_app_store_recipe_opt_out.py --xtensa-cc "$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" --bridges ../bridges --runtime ../runtime --profile-source ../profile-source --utilities ../utilities --output build/native-firmware-update/recipe-optout
      - name: Full native firmware recipe and strict target ELF
        run: NATIVE_APP_CC="$HOME/.platformio/packages/toolchain-xtensa-esp32s3/bin/xtensa-esp32s3-elf-gcc" python3 scripts/build_native_firmware_update_qualification.py --bridges ../bridges --runtime ../runtime --profile-source ../profile-source --utilities ../utilities --output-dir build/native-firmware-update/target
      - name: Exact-ELF Runtime admission and aligned memory accounting
        run: python3 scripts/report_native_firmware_update_memory.py --elf build/native-firmware-update/target/ota_update.elf --runtime ../runtime --output build/native-firmware-update/admission
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firmware-native-software-qualification-${{ github.event.pull_request.head.sha || github.sha }}
          path: source/build/native-firmware-update/
          retention-days: 14
          if-no-files-found: error
