name: Shared native typography
on:
  pull_request:
    paths:
      - 'lib/PortableApps/**'
      - 'scripts/test_native_typography.py'
      - 'test/native_apps/native_typography_test.c'
      - '.github/workflows/native-typography.yml'
  push:
    branches: [main, work/native-shared-typography-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typography:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Production native text and icons with independent pixel oracle
        run: python scripts/test_native_typography.py --output build/native-typography
      - name: Retained raster, glyph bytes, legacy UI and paper paths
        run: |
          python scripts/test_rf_native_raster.py --output build/native-typography/raster
          python scripts/test_watch_color_profile.py --evidence build/native-typography/color-profile.json
          python scripts/test_nova_text_faces_012.py
          python scripts/test_nova_ui.py
          python scripts/test_reader_paper_flip.py
          python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-typography-evidence
          path: |
            build/native-typography/**/*.json
            build/native-typography/**/*.log
            build/native-typography/**/*.ppm
          if-no-files-found: error
