name: Biome Monitor ESP32-C6
on:
  push:
    branches: ['native/esp32c6-epaper-capability']
    paths: ['profiles/esp32c6-epaper/**', '.github/workflows/esp32c6-epaper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4
      - name: Host regression checks
        shell: bash
        run: |
          cd profiles/esp32c6-epaper
          python3 -m unittest discover -s tests -v
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I main main/frame.c tests/frame_test.c -o /tmp/frame-test
          /tmp/frame-test
          gcc -std=c11 -Wall -Wextra -Werror -I tests/stubs -I main main/panel.c tests/panel_test.c -o /tmp/panel-test
          /tmp/panel-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I main main/presentation.c tests/presentation_test.c -o /tmp/presentation-test
          /tmp/presentation-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I main main/identity.c tests/identity_test.c -o /tmp/identity-test
          /tmp/identity-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I main main/recovery.c tests/recovery_test.c -o /tmp/recovery-test
          /tmp/recovery-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I main main/diagnostics.c tests/diagnostics_test.c -o /tmp/diagnostics-test
          /tmp/diagnostics-test
          gcc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I tests/idle_stubs -I "$IDF_PATH/components/esp_system/include" -I main "$IDF_PATH/components/esp_system/freertos_hooks.c" main/idle_guard.c tests/idle_guard_test.c -o /tmp/idle-guard-test
          /tmp/idle-guard-test
      - name: Build the recovered C6 board target
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd profiles/esp32c6-epaper
          idf.py set-target esp32c6
          idf.py build
          python3 tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: biome-monitor-esp32c6-v1.1.4
          path: profiles/esp32c6-epaper/dist/
          if-no-files-found: error
