name: Independent system app build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test SDK baseline, manifests, integrity and drift classification
        run: python -m unittest discover -s tests -v
      - run: python -m pip install Pillow==11.3.0
      - name: Exercise app UI and provider interaction fixtures
        run: |
          python scripts/test_apps.py
          python scripts/test_portable_apps.py
          python scripts/test_portable_wifi.py
          python scripts/test_portable_file_browser.py
          python scripts/test_file_browser_paper.py
          python scripts/test_file_browser_operations.py
          python scripts/test_file_browser_appdata_export.py
          python scripts/test_portable_update.py
          python scripts/test_portable_alarm.py
          python scripts/test_nova_ui.py
          python scripts/test_nova_settings.py
          python scripts/test_quick_actions.py
          python scripts/test_quick_radios.py
          python scripts/test_portable_audio.py
          python scripts/test_portable_radio.py
          python scripts/test_portable_alarm_settings.py
          python scripts/test_springboard_nova.py
          python scripts/test_springboard_paper.py
          python scripts/test_settings_paper.py
          python scripts/test_nova_launcher.py
          python scripts/test_portable_transition.py
          python test/native_apps/file_browser_oversize_usb_handle_runtime_test.py
      - name: Install pinned public compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Build and structurally validate all application ELFs
        run: |
          python scripts/build_all_apps.py
          python scripts/check_release_parity.py
          python scripts/build_portable_settings.py
          python scripts/build_portable_settings.py --display-rotation 90 --nova-ui --alarm-client --alarm-settings --navigation --output-dir dist/portable/settings-paper
          python scripts/build_portable_settings.py --nova-ui --alarm-client --alarm-settings --sleep-settings --denver --navigation --full-frames --output-dir dist/portable/settings-nova
          python scripts/build_portable_updates.py --services-only --rtc-utc-offset-seconds 28800
          python scripts/build_portable_file_browser.py --alarm-client --navigation
          python scripts/build_portable_file_browser.py --display-rotation 90 --storage-capability storage.volume --return-app springboard.elf --output-dir dist/portable/file-browser-paper
          python scripts/build_portable_file_browser.py --display-rotation 90 --storage-capability storage.volume --storage-instance 11 --secondary-storage-instance 22 --file-handlers --return-app springboard.elf --output-dir dist/portable/file-browser-contract-test
          python scripts/build_portable_file_browser.py --alarm-client --navigation --quick-controls --output-dir dist/portable/file-browser-quick
          python scripts/build_portable_wifi.py --alarm-client --navigation --full-frames --wifi-instance 15
          python scripts/build_portable_wifi.py --nova-ui --alarm-client --navigation --full-frames --wifi-instance 15 --output-dir dist/portable/wifi-nova
          python scripts/build_portable_settings.py --alarm-client --alarm-settings --sleep-settings --full-frames --output-dir dist/portable/settings-alarm
          python scripts/build_portable_springboard.py --alarm-client --full-frames --output-dir dist/portable/springboard-alarm
          python scripts/build_portable_springboard.py --nova-ui --alarm-client --denver --full-frames --retained-rgb565-handoff --handoff-ms 60 --return-app clock.elf --output-dir dist/portable/springboard-nova
          python scripts/build_portable_settings.py --denver --full-frames --sleep-settings --output-dir dist/portable/settings-sleep
          python scripts/build_portable_springboard.py --denver --full-frames --retained-rgb565-handoff --handoff-ms 60 --return-app clock.elf --output-dir dist/portable/springboard-handoff
          python scripts/build_portable_springboard.py
          python scripts/build_portable_springboard.py --navigation --display-rotation 90 --output-dir dist/portable/springboard-paper
          python scripts/build_portable_springboard.py --denver --touch-rotation 180 --output-dir dist/portable/springboard-denver
          python scripts/build_portable_settings.py --denver --touch-rotation 180 --output-dir dist/portable-denver
          python scripts/build_portable_settings.py --denver --navigation --touch-rotation 180 --output-dir dist/portable-navigation
      - uses: actions/upload-artifact@v4
        with:
          name: system-app-development-${{ github.sha }}
          path: |
            build/quick-actions/
            dist/apps/
            dist/portable/
            dist/portable-denver/
            dist/portable-navigation/
          if-no-files-found: error
          retention-days: 14
