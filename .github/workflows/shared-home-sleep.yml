name: Shared Home controller lifecycle
on:
  pull_request:
    paths: ['lib/PortableApps/src/PortableHomeSleep.c', 'lib/PortableApps/src/PortableHomeIdle.c', 'lib/PortableApps/include/PortableHomePower.h', 'test/native_apps/home_sleep_test.c', 'scripts/test_home_sleep.py', '.github/workflows/shared-home-sleep.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: a91edf3fada6a559ec107186dd163d0c8da10d29
          path: deps/runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Watch
          ref: 2d7dabd6a8452a8e7d437a8eb11fdc76d6766467
          path: deps/watch
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: 8f690e51b8c5f2a1756066879c40636469023639
          path: deps/utilities
          persist-credentials: false
      - run: python3 scripts/test_home_sleep.py --runtime deps/runtime --watch deps/watch --utilities deps/utilities --output qualification/sleep
      - name: Source receipts
        if: always()
        run: |
          mkdir -p qualification/source
          git archive HEAD | gzip -n > qualification/source/system.tar.gz
          for repo in runtime watch utilities; do git -C "deps/$repo" archive HEAD | gzip -n > "qualification/source/$repo.tar.gz"; git -C "deps/$repo" rev-parse HEAD > "qualification/source/$repo.head"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-home-sleep-${{ github.event.pull_request.head.sha || github.sha }}
          path: qualification/
          retention-days: 30
