name: LoRa native input qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Private ownership and historical feature-off controls
        run: |
          set -euo pipefail
          mkdir -p build/lora-native-ci
          python3 scripts/test_lora_native_input.py 2>&1 | tee build/lora-native-ci/input.log
          python3 scripts/test_lora_native_optout.py 2>&1 | tee build/lora-native-ci/optout.log
      - name: Exact existing-owner composition boundary
        run: python3 scripts/test_lora_native_composition.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lora-native-ownership-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/lora-native-ci/*.log
            build/lora-native-optout/results.json
            build/lora-native-composition/results.json
          retention-days: 14
          if-no-files-found: error
