name: Declarative scene prototype inputs
on:
  push:
    branches: [feat/declarative-alarms]
    paths: [.github/workflows/scene-prototype-inputs.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: System
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 3fcbba6a04626f8484a523e7da59fb44c82e6e49
          path: Runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: e80172353fcb9e6519ca9d9b2a4d43c69c1bc91d
          path: Utilities
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: 0a0dc0ec4c4a4b132fa4024678d86b56b486002f
          path: Watch
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiskRTE-XTEINK-X4-PRO
          ref: dfc0b418185872f87f7150d719047d979639f3c6
          path: X4
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the existing pinned target compiler
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install --global --tool 'espressif/toolchain-xtensa-esp32s3@8.4.0+2021r2-patch5'
      - name: Archive tracked sources and compiler for offline development
        shell: bash
        run: |
          set -euo pipefail
          mkdir inputs
          for repo in Runtime System Utilities Watch X4; do
            git -C "$repo" rev-parse HEAD >> inputs/source-commits.txt
            git -C "$repo" archive --format=tar.gz --output="$GITHUB_WORKSPACE/inputs/$repo.tar.gz" HEAD
          done
          tar -C "$HOME/.platformio/packages" -czf inputs/xtensa-toolchain.tar.gz toolchain-xtensa-esp32s3
          (cd inputs && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: scene-prototype-inputs-${{ github.sha }}
          path: inputs/
          if-no-files-found: error
          retention-days: 7
