name: Frequency native input qualification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ownership:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/test_frequency_native_input.py
      - run: python3 scripts/test_frequency_native_optout.py
      - run: python3 scripts/test_calculator_native_input.py
      - run: python3 scripts/test_calculator_native_optout.py
      - uses: actions/upload-artifact@v4
        with:
          name: frequency-native-ownership-${{ github.sha }}
          path: |
            build/frequency-native-input/*.log
            build/frequency-native-optout/results.json
          retention-days: 14
          if-no-files-found: error
