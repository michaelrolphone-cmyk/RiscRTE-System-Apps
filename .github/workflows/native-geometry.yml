name: Shared native geometry bounds
on:
  pull_request:
    paths:
      - 'lib/PortableApps/**'
      - 'scripts/test_native_geometry.py'
      - 'scripts/test_watch_color_profile.py'
      - 'test/native_apps/native_geometry*'
      - '.github/workflows/native-geometry.yml'
  push:
    branches: [work/native-geometry-bounds-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Capability bounds and actual adapter profile paths
        run: |
          python scripts/test_native_geometry.py --output build/native-geometry/bounds
          python scripts/test_watch_color_profile.py --evidence build/native-geometry/admission.json
          python scripts/test_rf_native_raster.py --output build/native-geometry/raster
      - name: Existing input, overlay, ownership and paper contracts
        run: |
          python scripts/test_wifi_watch_touch.py --output build/native-geometry/wifi-normal
          python scripts/test_wifi_watch_touch.py --sanitize --output build/native-geometry/wifi-sanitized
          python scripts/test_quick_native.py
          python scripts/test_portable_transition.py
          python scripts/test_reader_paper_flip.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-geometry-evidence
          path: |
            build/native-geometry/**/*.json
            build/native-geometry/**/*.log
          if-no-files-found: error
